<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真 → PDF 変換ツール</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="manifest" href="assets/manifest.json">
<meta name="theme-color" content="#3b6df0">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1b1e24;
    --muted: #666f7a;
    --accent: #3b6df0;
    --accent-dark: #2e56c6;
    --border: #e1e4e9;
    --danger: #e0453e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1e2126;
      --text: #eef0f3;
      --muted: #9aa3ad;
      --accent: #5b86ff;
      --accent-dark: #3b6df0;
      --border: #2c3036;
      --danger: #ff6b64;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    color: var(--muted);
  }
  #dropzone.drag { border-color: var(--accent); background: rgba(59,109,240,0.06); color: var(--text); }
  #dropzone strong { color: var(--accent); }
  #fileInput { display: none; }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 18px;
  }
  .opt { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }
  .opt select, .opt input[type=range] { accent-color: var(--accent); }
  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.9rem;
  }

  #list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .thumb {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  .thumb.dragging { opacity: 0.4; }
  .thumb img { display: block; width: 100%; height: 100px; object-fit: cover; }
  .thumb .idx {
    position: absolute; top: 6px; left: 6px;
    background: rgba(0,0,0,0.6); color: #fff;
    font-size: 0.7rem; padding: 1px 6px; border-radius: 10px;
  }
  .thumb .remove {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none;
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .thumb .remove:hover { background: var(--danger); }

  .empty-hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }

  .actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 9px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button.secondary:hover { color: var(--text); border-color: var(--muted); }

  #status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>写真 → PDF 変換ツール</h1>
  <p class="subtitle">画像はブラウザ内だけで処理されます。サーバーには一切アップロードされません。</p>

  <div class="panel">
    <div id="dropzone">
      <div><strong>クリックして写真を選択</strong> または ここにドラッグ＆ドロップ</div>
      <div style="font-size:0.78rem;margin-top:6px;">JPEG / PNG / WebP / GIF 対応・複数選択可</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <div class="options">
      <label class="opt">
        ページサイズ
        <select id="pageSize">
          <option value="a4">A4（余白あり・自動縦横）</option>
          <option value="letter">Letter（余白あり・自動縦横）</option>
          <option value="fit">写真のサイズに合わせる（余白なし）</option>
        </select>
      </label>
      <label class="opt">
        画質: <span id="qualityVal">92</span>%
        <input type="range" id="quality" min="30" max="100" value="92">
      </label>
    </div>

    <div id="list"></div>
    <div class="empty-hint" id="emptyHint">まだ写真が選択されていません。</div>

    <div class="actions">
      <button class="primary" id="convertBtn" disabled>PDFに変換してダウンロード</button>
      <button class="secondary" id="clearBtn">すべてクリア</button>
      <span id="status"></span>
    </div>
  </div>

  <footer>並び替えはサムネイルをドラッグして入れ替えできます。変換結果は端末内でのみ生成されます。</footer>
</div>

<script>
(() => {
  "use strict";

  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const list = document.getElementById("list");
  const emptyHint = document.getElementById("emptyHint");
  const convertBtn = document.getElementById("convertBtn");
  const clearBtn = document.getElementById("clearBtn");
  const statusEl = document.getElementById("status");
  const pageSizeSel = document.getElementById("pageSize");
  const qualityInput = document.getElementById("quality");
  const qualityVal = document.getElementById("qualityVal");

  /** @type {{id:number, file:File, url:string}[]} */
  let items = [];
  let nextId = 1;
  let dragSrcId = null;

  qualityInput.addEventListener("input", () => {
    qualityVal.textContent = qualityInput.value;
  });

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener("change", () => {
    addFiles(fileInput.files);
    fileInput.value = "";
  });

  function addFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
    for (const file of files) {
      items.push({ id: nextId++, file, url: URL.createObjectURL(file) });
    }
    render();
  }

  function removeItem(id) {
    items = items.filter(it => it.id !== id);
    render();
  }

  function render() {
    list.innerHTML = "";
    emptyHint.style.display = items.length ? "none" : "block";
    convertBtn.disabled = items.length === 0;

    items.forEach((it, i) => {
      const card = document.createElement("div");
      card.className = "thumb";
      card.draggable = true;
      card.dataset.id = String(it.id);

      const img = document.createElement("img");
      img.src = it.url;
      img.alt = it.file.name;

      const idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1);

      const rm = document.createElement("button");
      rm.className = "remove";
      rm.type = "button";
      rm.textContent = "×";
      rm.addEventListener("click", (e) => { e.stopPropagation(); removeItem(it.id); });

      card.append(img, idx, rm);
      list.appendChild(card);

      card.addEventListener("dragstart", () => {
        dragSrcId = it.id;
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        dragSrcId = null;
      });
      card.addEventListener("dragover", (e) => e.preventDefault());
      card.addEventListener("drop", (e) => {
        e.preventDefault();
        if (dragSrcId === null || dragSrcId === it.id) return;
        const from = items.findIndex(x => x.id === dragSrcId);
        const to = items.findIndex(x => x.id === it.id);
        if (from === -1 || to === -1) return;
        const [moved] = items.splice(from, 1);
        items.splice(to, 0, moved);
        render();
      });
    });
  }

  clearBtn.addEventListener("click", () => {
    items.forEach(it => URL.revokeObjectURL(it.url));
    items = [];
    render();
    statusEl.textContent = "";
  });

  // ---------- Image loading / JPEG re-encoding ----------

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
  }

  // Draws the source image onto a canvas (flattening transparency onto white)
  // and returns { jpegBytes, pxWidth, pxHeight }.
  async function toJpegBytes(url, quality) {
    const img = await loadImage(url);
    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg", quality);
    const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return { jpegBytes: bytes, pxWidth: canvas.width, pxHeight: canvas.height };
  }

  // ---------- Minimal, dependency-free PDF writer ----------
  // Embeds JPEG images directly via the DCTDecode filter so no external
  // library is required and file size stays close to the source JPEGs.

  const PX_TO_PT = 72 / 96; // assume 96 CSS px per inch

  function concatBytes(chunks) {
    let total = 0;
    for (const c of chunks) total += c.length;
    const out = new Uint8Array(total);
    let offset = 0;
    for (const c of chunks) { out.set(c, offset); offset += c.length; }
    return out;
  }

  function buildPdf(pages) {
    // pages: [{ pageW, pageH, drawX, drawY, drawW, drawH, pxW, pxH, jpegBytes }]
    const enc = new TextEncoder();
    const objects = []; // array of Uint8Array, index 0 => object number 1

    // obj 1: Catalog, obj 2: Pages (filled in after we know kid numbers)
    const n = pages.length;
    const kidNums = [];
    for (let i = 0; i < n; i++) {
      const pageNum = 3 + i * 3;
      kidNums.push(pageNum);
    }

    objects.push(enc.encode(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`));
    objects.push(enc.encode(
      `2 0 obj\n<< /Type /Pages /Kids [${kidNums.map(k => k + " 0 R").join(" ")}] /Count ${n} >>\nendobj\n`
    ));

    for (let i = 0; i < n; i++) {
      const p = pages[i];
      const pageNum = 3 + i * 3;
      const contentNum = pageNum + 1;
      const imageNum = pageNum + 2;

      const contentStr =
        `q\n${p.drawW.toFixed(2)} 0 0 ${p.drawH.toFixed(2)} ${p.drawX.toFixed(2)} ${p.drawY.toFixed(2)} cm\n/Im0 Do\nQ`;
      const contentBytes = enc.encode(contentStr);

      objects[pageNum - 1] = enc.encode(
        `${pageNum} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pageW.toFixed(2)} ${p.pageH.toFixed(2)}] ` +
        `/Resources << /XObject << /Im0 ${imageNum} 0 R >> >> /Contents ${contentNum} 0 R >>\nendobj\n`
      );

      objects[contentNum - 1] = concatBytes([
        enc.encode(`${contentNum} 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`),
        contentBytes,
        enc.encode(`\nendstream\nendobj\n`)
      ]);

      objects[imageNum - 1] = concatBytes([
        enc.encode(
          `${imageNum} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.pxW} /Height ${p.pxH} ` +
          `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpegBytes.length} >>\nstream\n`
        ),
        p.jpegBytes,
        enc.encode(`\nendstream\nendobj\n`)
      ]);
    }

    const header = concatBytes([
      enc.encode("%PDF-1.4\n%"),
      new Uint8Array([0xe2, 0xe3, 0xcf, 0xd3]),
      enc.encode("\n")
    ]);
    const parts = [header];
    const offsets = [0]; // offsets[0] unused placeholder for object 0
    let cursor = header.length;
    for (const obj of objects) {
      offsets.push(cursor);
      parts.push(obj);
      cursor += obj.length;
    }

    const xrefStart = cursor;
    let xref = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= objects.length; i++) {
      xref += `${String(offsets[i]).padStart(10, "0")} 00000 n \n`;
    }
    const trailer =
      `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;

    parts.push(enc.encode(xref));
    parts.push(enc.encode(trailer));

    return concatBytes(parts);
  }

  function computeLayout(pageSizeMode, pxW, pxH) {
    const imgWpt = pxW * PX_TO_PT;
    const imgHpt = pxH * PX_TO_PT;

    if (pageSizeMode === "fit") {
      return { pageW: imgWpt, pageH: imgHpt, drawX: 0, drawY: 0, drawW: imgWpt, drawH: imgHpt };
    }

    const margin = 24; // pt
    let baseW = pageSizeMode === "letter" ? 612 : 595.28;
    let baseH = pageSizeMode === "letter" ? 792 : 841.89;
    // Auto-orient the page (landscape) if the photo is wider than tall.
    if (imgWpt > imgHpt) [baseW, baseH] = [baseH, baseW];

    const availW = baseW - margin * 2;
    const availH = baseH - margin * 2;
    const scale = Math.min(availW / imgWpt, availH / imgHpt, 1) ||
      Math.min(availW / imgWpt, availH / imgHpt);
    const drawW = imgWpt * scale;
    const drawH = imgHpt * scale;
    const drawX = (baseW - drawW) / 2;
    const drawY = (baseH - drawH) / 2;
    return { pageW: baseW, pageH: baseH, drawX, drawY, drawW, drawH };
  }

  convertBtn.addEventListener("click", async () => {
    if (items.length === 0) return;
    convertBtn.disabled = true;
    clearBtn.disabled = true;
    const quality = Number(qualityInput.value) / 100;
    const pageSizeMode = pageSizeSel.value;

    try {
      const pages = [];
      for (let i = 0; i < items.length; i++) {
        statusEl.textContent = `処理中… (${i + 1}/${items.length})`;
        const { jpegBytes, pxWidth, pxHeight } = await toJpegBytes(items[i].url, quality);
        const layout = computeLayout(pageSizeMode, pxWidth, pxHeight);
        pages.push({ ...layout, pxW: pxWidth, pxH: pxHeight, jpegBytes });
      }

      statusEl.textContent = "PDFを生成中…";
      const pdfBytes = buildPdf(pages);
      const blob = new Blob([pdfBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
      a.download = `photos_${stamp}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      statusEl.textContent = `完了：${items.length}枚をPDFに変換しました。`;
    } catch (err) {
      console.error(err);
      statusEl.textContent = "エラーが発生しました: " + (err && err.message ? err.message : String(err));
    } finally {
      convertBtn.disabled = items.length === 0;
      clearBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
